<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>CloudDev Pro</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .pro-badge { background: #eab308; padding: 2px 6px; border-radius: 4px; color: black; font-weight: bold; font-size: 12px; }
        textarea { width: 100%; height: 300px; background: #1e293b; color: white; border: 1px solid #334155; padding: 10px; border-radius: 8px; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h2>CloudDev Studio <span class="pro-badge">PRO</span></h2>
    </header>
    
    <textarea id="editor" placeholder="Kodunu yaz..."></textarea>
    <br><br>
    <button onclick="saveCode()">Kaydet</button>
    <button onclick="askAI()">AI ile Geliştir (Pro)</button>

    <script>
        const deviceId = localStorage.getItem('did') || Math.random().toString(36).substr(2, 9);
        localStorage.setItem('did', deviceId);

        async function saveCode() {
            const code = document.getElementById('editor').value;
            const res = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: deviceId, code: code })
            });
            alert("Kod buluta kaydedildi!");
        }

        async function askAI() {
            const code = document.getElementById('editor').value;
            const res = await fetch('/api/ask-ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: deviceId, code: code })
            });
            const data = await res.json();
            if(data.status === "error") {
                alert(data.message);
            } else {
                document.getElementById('editor').value = data.code;
            }
        }
    </script>
</body>
</html>
